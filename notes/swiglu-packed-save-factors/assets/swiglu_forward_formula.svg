<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU forward formula</title>
  <desc id="desc">Forward dataflow for SwiGLU: x times W, split into left and gate, apply SiLU to gate, multiply with left, and produce output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .blue { fill: #eff6ff; stroke: #bfdbfe; }
      .green { fill: #ecfdf5; stroke: #a7f3d0; }
      .orange { fill: #fff7ed; stroke: #fed7aa; }
      .purple { fill: #f5f3ff; stroke: #ddd6fe; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .math { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="560"/>
  <text class="title" x="52" y="54">SwiGLU Forward</text>
  <text class="subtitle" x="52" y="82">A single projection is split into value and gate, then the gate modulates the value through SiLU.</text>

  <rect class="box blue" x="58" y="185" width="150" height="94"/>
  <text class="label" x="92" y="220">x</text>
  <text class="small" x="92" y="247">[M, K]</text>

  <rect class="box" x="275" y="165" width="190" height="134"/>
  <text class="label" x="312" y="204">Projection</text>
  <text class="small" x="312" y="232">preact = x @ W</text>
  <text class="small" x="312" y="258">[M, 2N]</text>

  <rect class="box purple" x="535" y="112" width="170" height="96"/>
  <text class="label" x="581" y="148">left</text>
  <text class="small" x="579" y="176">[M, N]</text>

  <rect class="box orange" x="535" y="290" width="170" height="96"/>
  <text class="label" x="579" y="326">gate</text>
  <text class="small" x="579" y="354">[M, N]</text>

  <rect class="box orange" x="785" y="290" width="190" height="96"/>
  <text class="label" x="826" y="326">SiLU</text>
  <text class="small" x="822" y="354">gate * sigmoid(gate)</text>

  <rect class="box green" x="1048" y="184" width="180" height="104"/>
  <text class="label" x="1088" y="222">multiply</text>
  <text class="small" x="1084" y="250">out [M, N]</text>

  <path class="arrow" d="M 208 232 L 275 232"/>
  <path class="arrow" d="M 465 232 C 500 232 500 160 535 160"/>
  <path class="arrow" d="M 465 232 C 500 232 500 338 535 338"/>
  <path class="arrow" d="M 705 338 L 785 338"/>
  <path class="arrow" d="M 705 160 C 875 160 940 206 1048 224"/>
  <path class="arrow" d="M 975 338 C 1018 338 1018 252 1048 252"/>

  <rect class="box" x="265" y="405" width="750" height="80"/>
  <text class="math" x="300" y="440">out = left * silu(gate) = left * gate * sigmoid(gate)</text>
  <text class="small" x="300" y="468">The activation itself is elementwise; the expensive part is producing left/gate.</text>
</svg>
