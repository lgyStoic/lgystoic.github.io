<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU backward formula</title>
  <desc id="desc">Backward formula for SwiGLU: dy flows into dleft and dgate, which are concatenated as grad_de and consumed by grad_x and grad_weight GEMMs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .blue { fill: #eff6ff; stroke: #bfdbfe; }
      .green { fill: #ecfdf5; stroke: #a7f3d0; }
      .orange { fill: #fff7ed; stroke: #fed7aa; }
      .rose { fill: #fff1f2; stroke: #fecdd3; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .math { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="650"/>
  <text class="title" x="52" y="54">SwiGLU Backward</text>
  <text class="subtitle" x="52" y="82">The activation backward creates grad_de = [dleft | dgate], then two GEMMs compute input and weight gradients.</text>

  <rect class="box blue" x="58" y="255" width="150" height="92"/>
  <text class="label" x="96" y="290">dy</text>
  <text class="small" x="90" y="318">[M, N]</text>

  <rect class="box" x="285" y="132" width="290" height="122"/>
  <text class="label" x="318" y="170">dleft branch</text>
  <text class="math" x="318" y="204">dleft = dy * silu(gate)</text>
  <text class="small" x="318" y="232">needs gate or factor_left</text>

  <rect class="box" x="285" y="382" width="345" height="138"/>
  <text class="label" x="318" y="420">dgate branch</text>
  <text class="math" x="318" y="454">dgate = dy * left * silu'(gate)</text>
  <text class="small" x="318" y="482">silu'(z) = s * (1 + z * (1 - s))</text>

  <rect class="box orange" x="720" y="245" width="215" height="128"/>
  <text class="label" x="762" y="282">grad_de</text>
  <text class="small" x="762" y="312">[dleft | dgate]</text>
  <text class="small" x="762" y="338">[M, 2N]</text>

  <rect class="box green" x="1035" y="150" width="190" height="108"/>
  <text class="label" x="1075" y="188">grad_x</text>
  <text class="small" x="1066" y="218">grad_de @ W.T</text>

  <rect class="box rose" x="1035" y="382" width="190" height="108"/>
  <text class="label" x="1062" y="420">grad_weight</text>
  <text class="small" x="1066" y="450">x.T @ grad_de</text>

  <path class="arrow" d="M 208 301 C 238 301 250 193 285 193"/>
  <path class="arrow" d="M 208 301 C 238 301 250 451 285 451"/>
  <path class="arrow" d="M 575 193 C 650 193 652 286 720 286"/>
  <path class="arrow" d="M 630 451 C 670 451 674 338 720 338"/>
  <path class="arrow" d="M 935 288 C 982 288 987 204 1035 204"/>
  <path class="arrow" d="M 935 338 C 982 338 987 436 1035 436"/>

  <rect class="box" x="58" y="555" width="1108" height="58"/>
  <text class="math" x="90" y="590">save-factors makes dleft/dgate cheap: dleft = dy * factor_left, dgate = dy * factor_gate</text>
</svg>
