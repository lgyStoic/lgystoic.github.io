<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Save-factors rewrite</title>
  <desc id="desc">Comparison between baseline preactivation saving and optimized save-factors in-place grad_de rewrite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .bad { fill: #fff1f2; stroke: #fecdd3; }
      .good { fill: #ecfdf5; stroke: #a7f3d0; }
      .neutral { fill: #eff6ff; stroke: #bfdbfe; }
      .label { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .note { font: 650 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="620"/>
  <text class="title" x="52" y="54">Save-Factors Rewrite</text>
  <text class="subtitle" x="52" y="82">The optimized path saves the exact backward factors, then reuses the same allocation as grad_de.</text>

  <rect class="panel" x="56" y="120" width="560" height="410"/>
  <text class="label" x="92" y="162">Baseline: save preactivation</text>

  <rect class="bad" x="92" y="208" width="190" height="92" rx="14"/>
  <text class="label" x="128" y="244">preact</text>
  <text class="small" x="128" y="272">[left | gate]</text>

  <rect class="neutral" x="364" y="208" width="190" height="92" rx="14"/>
  <text class="label" x="404" y="244">recompute</text>
  <text class="small" x="394" y="272">sigmoid, silu'</text>

  <rect class="bad" x="228" y="374" width="210" height="92" rx="14"/>
  <text class="label" x="272" y="410">grad_de</text>
  <text class="small" x="270" y="438">new [M, 2N] buffer</text>

  <path class="arrow" d="M 282 254 L 364 254"/>
  <path class="arrow" d="M 459 300 C 459 338 396 352 350 374"/>
  <text class="note" x="92" y="505">Peak can contain both saved preact and new grad_de.</text>

  <rect class="panel" x="665" y="120" width="560" height="410"/>
  <text class="label" x="701" y="162">Optimized: save backward factors</text>

  <rect class="good" x="701" y="208" width="246" height="92" rx="14"/>
  <text class="label" x="744" y="244">factors</text>
  <text class="small" x="730" y="272">[silu(gate) | left*silu'(gate)]</text>

  <rect class="neutral" x="1001" y="208" width="166" height="92" rx="14"/>
  <text class="label" x="1048" y="244">dy</text>
  <text class="small" x="1035" y="272">[M, N]</text>

  <rect class="good" x="806" y="374" width="250" height="92" rx="14"/>
  <text class="label" x="848" y="410">grad_de</text>
  <text class="small" x="836" y="438">same allocation, in-place</text>

  <path class="arrow" d="M 824 300 C 824 340 870 352 910 374"/>
  <path class="arrow" d="M 1084 300 C 1084 340 1010 352 954 374"/>
  <text class="note" x="701" y="505">Backward activation becomes two multiplies and no extra grad_de allocation.</text>
</svg>
