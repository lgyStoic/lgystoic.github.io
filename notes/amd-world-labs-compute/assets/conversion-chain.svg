<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">从空间模型到用户任务的五步转换</title>
  <desc id="desc">模型、可测负载、软件系统、硬件路线和用户任务五个阶段。前两段有公开合作证据，后三段仍待证明。</desc>
  <rect width="1400" height="720" fill="#fbfaf8"/>
  <text x="76" y="90" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="700" fill="#1b1b1a">82 亿美元要走完的五步转换</text>
  <text x="76" y="132" font-family="Arial,'PingFang SC',sans-serif" font-size="22" fill="#78746c">有合作事实，不等于已经形成平台优势</text>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <g transform="translate(76 215)"><rect width="220" height="235" rx="6" fill="#fff" stroke="#9a3412" stroke-width="3"/><text x="24" y="48" font-size="18" fill="#9a3412" font-weight="700">01 已公开</text><text x="24" y="98" font-size="30" fill="#1b1b1a" font-weight="700">空间模型</text><text x="24" y="142" font-size="20" fill="#3d3e3c">Atlas 架构</text><text x="24" y="178" font-size="20" fill="#3d3e3c">训练与推理</text></g>
    <path d="M305 333h54" stroke="#9a3412" stroke-width="4"/><path d="m349 321 16 12-16 12" fill="none" stroke="#9a3412" stroke-width="4"/>
    <g transform="translate(374 215)"><rect width="220" height="235" rx="6" fill="#fff" stroke="#9a3412" stroke-width="3"/><text x="24" y="48" font-size="18" fill="#9a3412" font-weight="700">02 合作已开始</text><text x="24" y="98" font-size="30" fill="#1b1b1a" font-weight="700">可测负载</text><text x="24" y="142" font-size="20" fill="#3d3e3c">显存 · 延迟</text><text x="24" y="178" font-size="20" fill="#3d3e3c">通信 · 吞吐</text></g>
    <path d="M603 333h54" stroke="#b9b4aa" stroke-width="4" stroke-dasharray="8 8"/><path d="m647 321 16 12-16 12" fill="none" stroke="#b9b4aa" stroke-width="4"/>
    <g transform="translate(672 215)"><rect width="220" height="235" rx="6" fill="#fff" stroke="#d8d3c9" stroke-width="2"/><text x="24" y="48" font-size="18" fill="#78746c" font-weight="700">03 待验证</text><text x="24" y="98" font-size="30" fill="#1b1b1a" font-weight="700">软件系统</text><text x="24" y="142" font-size="20" fill="#3d3e3c">ROCm · 编译器</text><text x="24" y="178" font-size="20" fill="#3d3e3c">缓存 · 服务</text></g>
    <path d="M901 333h54" stroke="#b9b4aa" stroke-width="4" stroke-dasharray="8 8"/><path d="m945 321 16 12-16 12" fill="none" stroke="#b9b4aa" stroke-width="4"/>
    <g transform="translate(970 215)"><rect width="220" height="235" rx="6" fill="#fff" stroke="#d8d3c9" stroke-width="2"/><text x="24" y="48" font-size="18" fill="#78746c" font-weight="700">04 待验证</text><text x="24" y="98" font-size="30" fill="#1b1b1a" font-weight="700">硬件路线</text><text x="24" y="142" font-size="20" fill="#3d3e3c">HBM · 互连</text><text x="24" y="178" font-size="20" fill="#3d3e3c">芯片 · 机架</text></g>
    <path d="M1199 333h54" stroke="#b9b4aa" stroke-width="4" stroke-dasharray="8 8"/><path d="m1243 321 16 12-16 12" fill="none" stroke="#b9b4aa" stroke-width="4"/>
    <g transform="translate(1268 215)"><rect width="96" height="235" rx="6" fill="#1b1b1a"/><text x="48" y="48" text-anchor="middle" font-size="18" fill="#f2b49a" font-weight="700">05</text><text x="48" y="94" text-anchor="middle" font-size="25" fill="#fff" font-weight="700">用</text><text x="48" y="130" text-anchor="middle" font-size="25" fill="#fff" font-weight="700">户</text><text x="48" y="166" text-anchor="middle" font-size="25" fill="#fff" font-weight="700">任</text><text x="48" y="202" text-anchor="middle" font-size="25" fill="#fff" font-weight="700">务</text></g>
    <rect x="76" y="510" width="518" height="78" rx="4" fill="#f5e8e1"/><text x="100" y="543" font-size="20" fill="#9a3412" font-weight="700">公开证据覆盖到这里</text><text x="100" y="570" font-size="17" fill="#6b4b3e">双方确认从 2025 年开始做训练与推理优化</text>
    <rect x="672" y="510" width="692" height="78" rx="4" fill="#f2f0eb"/><text x="696" y="543" font-size="20" fill="#56524b" font-weight="700">平台优势仍要验收</text><text x="696" y="570" font-size="17" fill="#78746c">固定质量下的延迟、吞吐、显存、成本、能耗和开发工作量</text>
  </g>
</svg>
