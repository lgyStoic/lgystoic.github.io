name: 开源贡献路线
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all = 全部仓库；focus = 只跑重点仓库（sglang-omni、edge-dit.cpp），其余原样保留"
        type: choice
        options: [all, focus]
        default: all
      reuse_run_id:
        description: "只重做合并：填一个已跑完分析的 run id，直接用它的产物合并渲染，不再调用模型"
        type: string
        default: ""
  schedule:
    - cron: "20 1 * * 1"   # 周一：全部仓库
    - cron: "20 1 * * 4"   # 周四：只刷重点仓库
permissions: {contents: write}
concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      scope: ${{ steps.list.outputs.scope }}
      reuse: ${{ steps.list.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - id: list
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
          REUSE: ${{ github.event.inputs.reuse_run_id }}
        run: |
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          SCOPE=all
          if [ "$SCHEDULE" = "20 1 * * 4" ] || [ "$INPUT_SCOPE" = "focus" ]; then SCOPE=focus; fi
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          if [ "$SCOPE" = focus ]; then
            echo "repos=$(python3 tools/contributions.py --list --focus)" >> "$GITHUB_OUTPUT"
          else
            echo "repos=$(python3 tools/contributions.py --list)" >> "$GITHUB_OUTPUT"
          fi
          echo "scope=$SCOPE"

  analyze:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        repo: ${{ fromJson(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 分析 ${{ matrix.repo }}
        env:
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          GITHUB_TOKEN: ${{ github.token }}
          LONGCAT_MAX_TOKENS: "32768"
          LONGCAT_TIMEOUT: "600"
          REPO: ${{ matrix.repo }}
        run: |
          python3 tools/contributions.py --only "$REPO" --out "out/${REPO//\//-}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: contrib-${{ strategy.job-index }}
          path: out/
          retention-days: 3

  merge:
    needs: [plan, analyze]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: contrib-*
          path: results
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}
      - name: 合并并渲染
        run: |
          ls -la results
          SCOPE="${{ needs.plan.outputs.scope }}"
          python3 tools/contributions.py --merge results --scope "${SCOPE:-all}"
          python3 tools/build.py
      - name: 提交结果
        # 运行期间 master 可能有新提交；不 rebase 生成物，而是保留本次数据、回到最新 master 重新渲染再提交，最多三次。
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git add -A
            git reset -q -- results
            if git diff --cached --quiet; then
              echo "没有变化，跳过提交"
              exit 0
            fi
            git commit -q -m "roadmap: refresh contribution plan"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "推送被拒（master 有新提交），第 ${attempt} 次：保留数据，回到最新 master 重新渲染"
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            cp radar/data/contributions.json /tmp/keep/contributions.json
            git fetch origin master
            git reset -q --hard origin/master
            cp /tmp/keep/contributions.json radar/data/contributions.json
            python3 tools/build.py
          done
          echo "连续三次都没推上去"
          exit 1
