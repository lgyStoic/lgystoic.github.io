name: GPU runner 环境检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, dd-lgystoic]
    timeout-minutes: 5
    steps:
      - name: 检查显卡与开发环境
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "=== OS ==="
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_ComputerSystem | Select-Object HypervisorPresent
          Get-CimInstance Win32_Processor | Select-Object VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions
          Write-Output "=== NVIDIA GPU / driver ==="
          $smi = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if (-not $smi) {
            $candidate = Join-Path $env:SystemRoot 'System32/nvidia-smi.exe'
            if (Test-Path $candidate) { $smi = $candidate }
          }
          if ($smi) {
            & $smi --query-gpu=name,driver_version,memory.total --format=csv
            & $smi
          } else {
            Write-Output 'nvidia-smi not found; check driver and PATH.'
          }
          Write-Output "=== CUDA toolkit ==="
          if (Get-Command nvcc -ErrorAction SilentlyContinue) { nvcc --version }
          Write-Output "=== Registered WSL distributions and launcher permissions ==="
          $wslRegistry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss'
          if (Test-Path $wslRegistry) {
            Get-ChildItem $wslRegistry | ForEach-Object { Get-ItemProperty $_.PSPath } | Select-Object DistributionName, Version | Format-Table -AutoSize
          }
          Get-Service WslService,LxssManager -ErrorAction SilentlyContinue | Select-Object Name, Status | Format-Table -AutoSize
          $wslLauncher = Join-Path $env:SystemRoot 'System32\wsl.exe'
          Get-Acl $wslLauncher | Select-Object Owner, AccessToString | Format-List
          Write-Output "=== Python / Git / Docker / WSL ==="
          foreach ($tool in @('python', 'py', 'git', 'docker', 'wsl')) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if ($command) {
              Write-Output "$tool : $($command.Source)"
              if ($tool -eq 'wsl') {
                & $tool --status
                & $tool --list --verbose
                $distros = (& $tool --list --quiet 2>$null) -join ''
                $distros = ([string]$distros).Replace([string][char]0, '').Trim()
                if ($distros -match 'Ubuntu|Debian|docker-desktop') {
                  & $tool --exec sh -lc 'uname -r; command -v docker; command -v python3; /usr/lib/wsl/lib/nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv'
                }
              }
              elseif ($tool -eq 'docker') { & $tool version }
              else { & $tool --version }
            } else { Write-Output "$tool : not found in PATH" }
          }
          Write-Output "=== PyTorch CUDA smoke test (existing installation only) ==="
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            @'
          import importlib.util
          if importlib.util.find_spec('torch') is None:
              print('PyTorch not installed; probe does not install dependencies.')
              raise SystemExit(0)
          import torch
          print('torch:', torch.__version__, 'CUDA runtime:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('compiled architectures:', torch.cuda.get_arch_list())
              for index in range(torch.cuda.device_count()):
                  print('GPU:', index, torch.cuda.get_device_name(index),
                        'capability:', torch.cuda.get_device_capability(index))
                  with torch.cuda.device(index):
                      x = torch.ones((32, 32), device='cuda')
                      result = x @ x
                      torch.cuda.synchronize()
                      assert result[0, 0].item() == 32
                      print('CUDA matrix multiplication: PASS')
          '@ | & $python -
            if ($LASTEXITCODE -ne 0) { throw 'PyTorch CUDA probe failed; inspect errors above.' }
          }
          $global:LASTEXITCODE = 0
