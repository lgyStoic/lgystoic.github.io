name: 内容交接调度

on:
  schedule:
    - cron: "0 16 * * *"  # 北京时间次日 00:00；GitHub schedule 可能排队延迟
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 读取私有 inbox
        env:
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          INBOX_REPO: ${{ vars.INBOX_REPO || 'lgyStoic/radar-inbox' }}
        run: git clone --depth 1 "https://x-access-token:${INBOX_TOKEN}@github.com/${INBOX_REPO}.git" private-inbox
      - name: 生成当前交接和检查回执
        id: check
        run: |
          python3 tools/content_flow/build_private_manifest.py --root private-inbox --output private-artifact-manifest.json
          python3 tools/content_flow/build_manifest.py --output public-artifact-manifest.json
          python3 tools/content_flow/create_handoff.py public-artifact-manifest.json private-artifact-manifest.json --output handoff.json
          id=$(python3 -c 'import json; print(json.load(open("handoff.json"))["handoff_id"])')
          mkdir -p private-inbox/posts/.pipeline/handoffs
          persisted="private-inbox/posts/.pipeline/handoffs/${id}.json"
          if [ -f "$persisted" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path("handoff.json").read_text())
          old = json.loads(Path("private-inbox/posts/.pipeline/handoffs/" + current["handoff_id"] + ".json").read_text())
          current["created_at"] = old["created_at"]
          Path("handoff.json").write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n")
          PY
          else
            cp handoff.json "$persisted"
          fi
          if ! git -C private-inbox diff --quiet; then
            git -C private-inbox config user.name "content-flow-bot"
            git -C private-inbox config user.email "content-flow-bot@users.noreply.github.com"
            git -C private-inbox add posts/.pipeline/handoffs
            git -C private-inbox commit -m "记录内容交接状态 ${id}"
            git -C private-inbox push origin HEAD:main
          fi
          receipt="private-inbox/posts/.pipeline/handoffs/${id}.receipt.json"
          if [ -f "$receipt" ]; then
            python3 tools/content_flow/receipt.py "$persisted" --receipt "$receipt" --timeout-hours 24
          else
            python3 tools/content_flow/receipt.py "$persisted" --timeout-hours 24
          fi
          python3 tools/content_flow/package_delivery.py --root private-inbox --output delivery
      - name: 发送超时告警并验证 Gmail 收件
        if: ${{ failure() }}
        env:
          RADAR_ALERT_SMTP_HOST: smtp.gmail.com
          RADAR_ALERT_SMTP_USER: ${{ secrets.RADAR_ALERT_SMTP_USER }}
          RADAR_ALERT_SMTP_PASSWORD: ${{ secrets.RADAR_ALERT_SMTP_PASSWORD }}
          RADAR_ALERT_EMAIL_TO: ${{ secrets.RADAR_ALERT_EMAIL_TO }}
          RADAR_ALERT_EMAIL_FROM: ${{ secrets.RADAR_ALERT_EMAIL_FROM }}
        run: |
          python3 - <<'PY'
          import json
          from tools.content_flow.handoff_alert import send
          send({"handoff_id": json.load(open("handoff.json"))["handoff_id"], "status": "overdue_or_invalid_receipt"})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-flow-dispatch-${{ github.run_id }}
          path: |
            handoff.json
            public-artifact-manifest.json
            private-artifact-manifest.json
            delivery
          retention-days: 30
      - name: 发送交付通知并验证 Gmail 收件
        if: ${{ success() }}
        env:
          RADAR_ALERT_SMTP_HOST: smtp.gmail.com
          RADAR_ALERT_SMTP_USER: ${{ secrets.RADAR_ALERT_SMTP_USER }}
          RADAR_ALERT_SMTP_PASSWORD: ${{ secrets.RADAR_ALERT_SMTP_PASSWORD }}
          RADAR_ALERT_EMAIL_TO: ${{ secrets.RADAR_ALERT_EMAIL_TO }}
          RADAR_ALERT_EMAIL_FROM: ${{ secrets.RADAR_ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from tools.content_flow.delivery_notification import send
          data = json.load(open("delivery/delivery.json"))
          send(run_url=os.environ["RUN_URL"], artifact_name="content-flow-dispatch-${{ github.run_id }}", channels={k: v["status"] for k, v in data["channels"].items()})
          PY
