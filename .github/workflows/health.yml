name: 定时兜底

# 每天 09:11 和 11:07（北京时间）核对各阶段已提交产物；有缺口才补触发。
on:
  schedule:
    - cron: "11 1 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-daily-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查当天雷达、活动和专题产物
        id: probe
        env:
          RADAR_GUARD_MODE: health
        run: python3 tools/radar_stage_guard.py >> "$GITHUB_OUTPUT"
      - name: 补跑
        if: steps.probe.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --ref master -f reason=schedule_missed
