name: 工作机会聚合
on:
  workflow_dispatch:
    inputs:
      window_hours: {description: 抓取窗口（小时）, required: false, default: "24"}
  schedule:
    - cron: "35 0 * * *"
permissions: {contents: write}
jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: 抓取岗位并渲染
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOLEAN_TAVILY_API_KEY: ${{ secrets.BOOLEAN_TAVILY_API_KEY }}
        run: |
          python3 tools/jobs.py
          mapfile -t ATS_COMPANIES < <(python3 -c 'import json; print("\n".join(json.load(open("radar/ats_companies.json"))))')
          if git clone --depth 1 https://github.com/shunsukefuruyama/ats-jobs.git /tmp/ats-jobs && node /tmp/ats-jobs/bin/ats-jobs.js --json --descriptions --limit 200 "${ATS_COMPANIES[@]}" > radar/data/ats-jobs.json; then
            python3 tools/import_ats_jobs.py
          else
            python3 tools/import_ats_jobs.py --failed
          fi
          if python3 -m pip install --quiet 'jobsearch-buddy @ git+https://github.com/coryking/jobsearch-buddy.git'; then
            python3 tools/jobbuddy_enrich.py
          else
            python3 tools/jobbuddy_enrich.py --failed
          fi
          mkdir -p radar/data/liepin
          if git clone --depth 1 https://github.com/rockbenben/ai-job-search-cn.git /tmp/ai-job-search-cn; then
            LIEPIN_OK=0
            for QUERY in "AI Infra" "CUDA 推理" "大模型 推理 加速" "端侧部署"; do
              SLUG=$(printf '%s' "$QUERY" | sha256sum | cut -c1-12)
              if node /tmp/ai-job-search-cn/.agents/skills/liepin-search/cli/src/cli.ts search -q "$QUERY" -l "深圳" --limit 42 --format json > "radar/data/liepin/$SLUG.json"; then
                LIEPIN_OK=1
              else
                rm -f "radar/data/liepin/$SLUG.json"
              fi
              sleep 2
            done
            if [ "$LIEPIN_OK" = 1 ]; then python3 tools/import_liepin.py; else python3 tools/import_liepin.py --failed; fi
          else
            python3 tools/import_liepin.py --failed
          fi
          python3 tools/jobs_ai.py
          python3 tools/build.py
      - name: 提交结果
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add radar/data/jobs.json radar/jobs/index.html sitemap.xml index.html site.json
          git diff --cached --quiet || git commit -m "jobs: refresh" && git push origin HEAD:master
