name: 工作机会聚合
on:
  workflow_dispatch:
    inputs:
      window_hours: {description: 抓取窗口（小时）, required: false, default: "24"}
  schedule:
    - cron: "35 0 * * *"
permissions: {contents: write}
jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: 抓取岗位并渲染
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-pro-latest' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-flash-latest' }}
          BOOLEAN_TAVILY_API_KEY: ${{ secrets.BOOLEAN_TAVILY_API_KEY }}
        run: |
          python3 tools/jobs.py
          mapfile -t ATS_COMPANIES < <(python3 -c 'import json; print("\n".join(json.load(open("radar/ats_companies.json"))))')
          if git clone --depth 1 https://github.com/shunsukefuruyama/ats-jobs.git /tmp/ats-jobs && node /tmp/ats-jobs/bin/ats-jobs.js --json --descriptions --limit 200 "${ATS_COMPANIES[@]}" > radar/data/ats-jobs.json; then
            python3 tools/import_ats_jobs.py
          else
            python3 tools/import_ats_jobs.py --failed
          fi
          if python3 -m pip install --quiet 'jobsearch-buddy @ git+https://github.com/coryking/jobsearch-buddy.git'; then
            python3 tools/jobbuddy_enrich.py
          else
            python3 tools/jobbuddy_enrich.py --failed
          fi
          mkdir -p radar/data/liepin
          if git clone --depth 1 https://github.com/rockbenben/ai-job-search-cn.git /tmp/ai-job-search-cn; then
            LIEPIN_OK=0
            LIEPIN_FAILS=0
            for CITY in "深圳" "北京" "上海" "杭州" "广州"; do
            for QUERY in "AI Infra" "CUDA 算子" "Triton TensorRT" "大模型 推理 加速" "训练框架 分布式" "扩散模型 视频生成" "端侧部署 量化"; do
              # 连续 4 个查询都失败（猎聘封了 runner 出口或整站不可达）就不再一个个试：每次失败要 40 秒，35 个查询 × 3 次能把 30 分钟的 job 拖死
              if [ "$LIEPIN_FAILS" -ge 4 ]; then break 2; fi
              SLUG=$(printf '%s|%s' "$CITY" "$QUERY" | sha256sum | cut -c1-12)
              GOT=0
              for ATTEMPT in 1 2 3; do
                if timeout 90 node /tmp/ai-job-search-cn/.agents/skills/liepin-search/cli/src/cli.ts search -q "$QUERY" -l "$CITY" --limit 42 --format json > "radar/data/liepin/$SLUG.json"; then
                  LIEPIN_OK=1; GOT=1
                  break
                fi
                rm -f "radar/data/liepin/$SLUG.json"
                sleep $((ATTEMPT * 8))
              done
              if [ "$GOT" = 1 ]; then LIEPIN_FAILS=0; else LIEPIN_FAILS=$((LIEPIN_FAILS + 1)); fi
              sleep 2
            done
            done
            if [ "$LIEPIN_FAILS" -ge 4 ]; then echo "猎聘连续 ${LIEPIN_FAILS} 个查询失败，本轮放弃猎聘，沿用上次结果"; fi
            if [ "$LIEPIN_OK" = 1 ]; then python3 tools/import_liepin.py; else python3 tools/import_liepin.py --failed; fi
          else
            python3 tools/import_liepin.py --failed
          fi
          python3 tools/jobs_ai.py
          python3 tools/build.py
      - name: 提交结果
        # 运行期间 master 可能有新提交；不 rebase 生成物，而是保留本次数据、回到最新 master 重新渲染再提交，最多三次。
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git add -A
            if git diff --cached --quiet; then
              echo "没有变化，跳过提交"
              exit 0
            fi
            git commit -q -m "jobs: refresh"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "推送被拒（master 有新提交），第 ${attempt} 次：保留数据，回到最新 master 重新渲染"
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            [ -e radar/data/jobs.json ] && cp -r radar/data/jobs.json /tmp/keep/radar__data__jobs.json
            git fetch origin master
            git reset -q --hard origin/master
            [ -e /tmp/keep/radar__data__jobs.json ] && rm -rf radar/data/jobs.json && cp -r /tmp/keep/radar__data__jobs.json radar/data/jobs.json
            python3 tools/build.py
          done
          echo "连续三次都没推上去"
          exit 1
