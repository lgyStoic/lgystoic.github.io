name: GPU Docker 环境准备

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare-wsl 启用 WSL 前置条件但不重启；verify-docker 验证 Linux GPU 容器"
        type: choice
        options: [verify-docker, verify-uv, prepare-wsl, install-docker, verify-wsl-docker, reboot]
        default: verify-docker

permissions:
  contents: read

jobs:
  setup:
    runs-on: [self-hosted, Windows, X64, dd-lgystoic]
    timeout-minutes: 30
    steps:
      - name: 验证容器内 uv 与开发工具
        if: inputs.mode == 'verify-uv'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import pathlib
          import subprocess
          import sys
          import tempfile
          def run(*args):
              print('RUN:', ' '.join(args), flush=True)
              subprocess.run(args, check=True, timeout=180)
          run('uv', '--version')
          run(sys.executable, '--version')
          run('git', '--version')
          run('gcc', '--version')
          run('curl', '--version')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              venv = root / '.venv'
              run('uv', 'venv', str(venv))
              python = str(venv / 'bin/python')
              run('uv', 'pip', 'install', '--python', python, 'packaging')
              check = root / 'check.py'
              check.write_text('from packaging.version import Version\nassert Version("2.10") > Version("2.9")\nprint("uv installed package and ran Python: PASS")\n')
              run('uv', 'run', '--no-project', '--python', python, str(check))
              source = root / 'hello.c'
              source.write_text('#include <stdio.h>\nint main(void) { puts("C compilation: PASS"); return 0; }\n')
              binary = str(root / 'hello')
              run('gcc', str(source), '-o', binary)
              run(binary)
              run('git', 'init', str(root / 'repo'))
          print('uv, Python, package download, Git and C compiler: PASS', flush=True)
          '@
          $script | & docker run --rm -i ghcr.io/astral-sh/uv:python3.12-bookworm python -
          if ($LASTEXITCODE -ne 0) { throw 'Container uv and development tools verification failed.' }
      - name: 重启 5090（仅手动选择 reboot）
        if: inputs.mode == 'reboot'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Service -Name 'actions.runner.*' -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType
          Write-Output 'Scheduling the user-authorized reboot in 60 seconds so this job can finish.'
          & shutdown.exe /r /t 60 /c 'User-authorized reboot to activate WSL2 for GPU Docker.'
          if ($LASTEXITCODE -ne 0) { throw "Reboot scheduling failed: $LASTEXITCODE" }
      - name: 准备 WSL2（不自动重启）
        if: inputs.mode == 'prepare-wsl'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'WSL setup requires an elevated runner. No system changes were made.'
          }
          $restartRequired = $false
          foreach ($feature in @('Microsoft-Windows-Subsystem-Linux', 'VirtualMachinePlatform')) {
            $state = Get-WindowsOptionalFeature -Online -FeatureName $feature
            Write-Output "$feature : $($state.State)"
            if ($state.State -eq 'EnablePending') {
              $restartRequired = $true
            } elseif ($state.State -ne 'Enabled') {
              $result = Enable-WindowsOptionalFeature -Online -FeatureName $feature -All -NoRestart
              $restartRequired = $restartRequired -or $result.RestartNeeded
              Write-Output "$feature : enable requested; restart required: $($result.RestartNeeded)"
            }
          }
          $pendingReboot = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
          $hypervisorActive = (Get-CimInstance Win32_ComputerSystem).HypervisorPresent
          if ($restartRequired -or $pendingReboot -or -not $hypervisorActive) {
            Write-Output 'Windows features enabled; awaiting reboot. No reboot performed and WSL installation deferred until after reboot.'
            exit 0
          }
          & wsl.exe --install --no-distribution --no-reboot
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "WSL installation failed: $LASTEXITCODE" }
          Write-Output 'WSL preparation complete. No reboot performed. Reboot Windows before installing a Linux distribution and Docker Engine.'
          $global:LASTEXITCODE = 0
      - name: 验证 Linux GPU 容器
        if: inputs.mode == 'verify-docker'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw 'Docker CLI is not available in this runner PATH. Complete WSL2 and Docker installation first.'
          }
          $os = & docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os.Trim() -ne 'linux') {
            throw 'A running Linux Docker daemon is required.'
          }
          & docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          if ($LASTEXITCODE -ne 0) { throw 'Linux container GPU access failed.' }
      - name: 安装独立 WSL2 Ubuntu 与 Docker Engine
        if: inputs.mode == 'install-docker'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-CimInstance Win32_ComputerSystem).HypervisorPresent) {
            throw 'Windows virtualization platform is not active; complete the reboot first.'
          }
          & wsl.exe --install --no-distribution --no-reboot
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "WSL installation failed: $LASTEXITCODE" }
          $distro = 'GPU-Runner-Ubuntu'
          $distros = ((& wsl.exe --list --quiet) -join '').Replace([string][char]0, '')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list WSL distributions.' }
          if ($distros -notmatch [regex]::Escape($distro)) {
            $base = Join-Path $env:SystemDrive 'gpu-runner'
            New-Item -ItemType Directory -Force -Path "$base\downloads", "$base\wsl" | Out-Null
            $image = "$base\downloads\ubuntu-24.04.4-wsl-amd64.wsl"
            $expected = '9b2f7730dc68227dd04a9f3e5eab86ad85caf556b8606ad94f1f29ff5c4fd3f5'
            if (-not (Test-Path $image)) {
              & curl.exe --fail --location --retry 3 --output $image 'https://releases.ubuntu.com/24.04/ubuntu-24.04.4-wsl-amd64.wsl'
              if ($LASTEXITCODE -ne 0) { throw 'Ubuntu image download failed.' }
            }
            if ((Get-FileHash $image -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw 'Ubuntu image SHA256 mismatch; refusing import.'
            }
            & wsl.exe --import $distro "$base\wsl\Ubuntu" $image --version 2
            if ($LASTEXITCODE -ne 0) { throw 'Ubuntu WSL import failed.' }
            & wsl.exe -d $distro -u root --exec sh -c 'printf "[boot]\nsystemd=true\n" > /etc/wsl.conf'
            if ($LASTEXITCODE -ne 0) { throw 'WSL systemd configuration failed.' }
            & wsl.exe --terminate $distro
            if ($LASTEXITCODE -ne 0) { throw 'WSL restart failed.' }
          }
          $script = @'
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' > /etc/apt/sources.list.d/docker.list
          curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --batch --yes --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit.gpg
          curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nvidia-container-toolkit
          nvidia-ctk runtime configure --runtime=docker
          systemctl enable docker
          systemctl restart docker
          docker version
          /usr/lib/wsl/lib/nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          '@
          $script.Replace("`r", '') | & wsl.exe -d $distro -u root --exec bash -s
          if ($LASTEXITCODE -ne 0) { throw 'Docker installation or GPU container verification failed.' }
      - name: 验证 WSL2 中的 GPU 容器
        if: inputs.mode == 'verify-wsl-docker'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & wsl.exe -d GPU-Runner-Ubuntu -u root --exec docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          if ($LASTEXITCODE -ne 0) { throw 'WSL Docker GPU verification failed.' }
