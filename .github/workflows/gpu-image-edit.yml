name: GPU 图像编辑部署
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "sample 复用运行中服务跑一张图；deploy 才准备镜像并重新部署"
        options: [sample, probe, status, stop, repair-download, deploy]
        default: sample
      sample_source:
        type: choice
        description: "sample 输入：西湖双图人像、真实汽车照片或简笔杯子"
        options: [westlake, photo, mug]
        default: westlake
permissions:
  contents: read
concurrency:
  group: gpu-image-edit
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, dd-lgystoic]
    timeout-minutes: 120
    steps:
      - name: 停止图像编辑服务
        if: inputs.mode == 'stop'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $running = & docker ps --filter name=^gpu-image-edit$ --format '{{.Names}}'
          if ($running) { & docker stop gpu-image-edit }
          if ($LASTEXITCODE -ne 0) { throw 'Could not stop image-edit service.' }
      - uses: actions/checkout@v4
        if: inputs.mode != 'status' && inputs.mode != 'stop'
      - name: 用现有服务编辑一张示例图
        if: inputs.mode == 'sample'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $before = & docker inspect gpu-image-edit --format '{{.State.StartedAt}}'
          if ($LASTEXITCODE -ne 0) { throw 'Image-edit service does not exist; use deploy first.' }
          $running = & docker inspect gpu-image-edit --format '{{.State.Running}}'
          if ($LASTEXITCODE -ne 0 -or $running.Trim() -ne 'true') { throw 'Image-edit service is not running; use deploy first.' }
          if ('${{ inputs.sample_source }}' -eq 'photo') {
            & docker cp tools/gpu/samples/red-car.jpg gpu-image-edit:/tmp/gpu-image-real-photo.jpg
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy the real photo into the running container.' }
          }
          if ('${{ inputs.sample_source }}' -eq 'westlake') {
            & docker cp tools/gpu/samples/west-lake.jpg gpu-image-edit:/tmp/gpu-image-west-lake.jpg
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy the West Lake photo into the running container.' }
            & docker cp tools/gpu/samples/person-portrait.jpg gpu-image-edit:/tmp/gpu-image-person-portrait.jpg
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy the portrait into the running container.' }
          }
          $script = @'
          import base64, json, os, pathlib, shutil, time
          from contextlib import ExitStack
          import requests
          from PIL import Image, ImageDraw, ImageOps

          out = pathlib.Path('/outputs') / ('sample-' + os.environ['IMAGE_EDIT_SAMPLE_RUN_ID'])
          out.mkdir(parents=True, exist_ok=True)
          reference = out / 'reference.png'
          source = os.environ['IMAGE_EDIT_SAMPLE_SOURCE']
          size = '768x768' if source == 'westlake' else '512x512'
          if source == 'westlake':
              background = out / 'reference-west-lake.jpg'
              portrait = out / 'reference-person.jpg'
              shutil.copyfile('/tmp/gpu-image-west-lake.jpg', background)
              shutil.copyfile('/tmp/gpu-image-person-portrait.jpg', portrait)
              references = [background, portrait]
              prompt = ('Use Image 1 as the real West Lake, Hangzhou background with its lakeside pavilion and sunset sky. '
                        'Place the woman from Image 2 in the foreground as the main subject, keeping her face, hairstyle and black outfit recognizable. '
                        'Create a tasteful photorealistic editorial travel portrait with natural golden-hour light, realistic scale and shadows. '
                        'Preserve the recognizable West Lake scenery; do not retain the greenery from Image 2.')
          elif source == 'photo':
              with Image.open('/tmp/gpu-image-real-photo.jpg') as original:
                  canvas = ImageOps.fit(original.convert('RGB'), (512, 512), method=Image.Resampling.LANCZOS)
              prompt = 'Change only the red car paint to deep blue. Keep the car shape, windows, wheels, license plate, lighting, and street background unchanged.'
              canvas.save(reference)
              references = [reference]
          else:
              canvas = Image.new('RGB', (512, 512), 'white')
              draw = ImageDraw.Draw(canvas)
              draw.rounded_rectangle((140, 140, 320, 370), radius=24, fill='red')
              draw.arc((270, 170, 385, 330), 270, 90, fill='red', width=25)
              draw.ellipse((140, 120, 320, 170), fill='#aa0000')
              prompt = 'Change the red mug to blue. Keep the mug shape and white background unchanged.'
              canvas.save(reference)
              references = [reference]
          session = requests.Session()
          session.trust_env = False
          endpoint = 'http://127.0.0.1:30010'
          session.get(endpoint + '/health', timeout=10).raise_for_status()
          start = time.monotonic()
          with ExitStack() as stack:
              files = [('image[]', (path.name, stack.enter_context(path.open('rb')),
                         'image/jpeg' if path.suffix == '.jpg' else 'image/png')) for path in references]
              response = session.post(endpoint + '/v1/images/edits',
                  files=files,
                  data={'prompt': prompt,
                        'size': size, 'num_inference_steps': '20',
                        'n': '1', 'response_format': 'b64_json'}, timeout=1200)
          response.raise_for_status()
          payload = base64.b64decode(response.json()['data'][0]['b64_json'], validate=True)
          elapsed = round(time.monotonic() - start, 2)
          target = out / ('edited-' + size + '-20.png')
          target.write_bytes(payload)
          with Image.open(target) as edited:
              edited.load()
              assert edited.size == tuple(map(int, size.split('x')))
          report = {'elapsed_seconds': elapsed, 'size': size, 'steps': 20, 'source': source,
                    'input_images': [path.name for path in references],
                    'bytes': len(payload), 'output': target.name}
          (out / 'verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report), flush=True)
          '@
          $script | & docker exec -i -e IMAGE_EDIT_SAMPLE_RUN_ID=$env:GITHUB_RUN_ID -e IMAGE_EDIT_SAMPLE_SOURCE=${{ inputs.sample_source }} gpu-image-edit python -
          if ($LASTEXITCODE -ne 0) { throw 'Single-image request failed.' }
          $after = & docker inspect gpu-image-edit --format '{{.State.StartedAt}}'
          if ($LASTEXITCODE -ne 0 -or $before -ne $after) { throw 'Service restarted during the sample request.' }
          Write-Output "Service stayed online: $after"
          New-Item -ItemType Directory -Force -Path gpu-edit-sample-results | Out-Null
          & docker cp "gpu-image-edit:/outputs/sample-$env:GITHUB_RUN_ID/." gpu-edit-sample-results
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve sample result.' }
      - name: 检查资源并准备推理镜像
        if: inputs.mode != 'status' && inputs.mode != 'stop' && inputs.mode != 'sample'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv
          & docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} Root={{.DockerRootDir}}'
          & docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          & docker run --rm ghcr.io/astral-sh/uv:python3.12-bookworm df -h /
          & docker pull lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570
          if ($LASTEXITCODE -ne 0) { throw 'Runtime image pull failed.' }
          & docker image inspect lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 --format '{{json .RepoDigests}}'
          $script = @'
          import subprocess, sys, importlib.util
          import torch
          print('Python:', sys.version, flush=True)
          print('Torch:', torch.__version__, 'CUDA:', torch.version.cuda, flush=True)
          print('GPU:', torch.cuda.get_device_name(), flush=True)
          print('Architectures:', torch.cuda.get_arch_list(), flush=True)
          for module in ['sglang.multimodal_gen.runtime.models.dits.qwen_image21', 'gguf']:
              print(module, importlib.util.find_spec(module), flush=True)
          subprocess.run(['df','-h','/'],check=True)
          '@
          $script | & docker run --rm --gpus all -i lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python -
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compatibility probe failed.' }
      - name: 查看已启动的编辑与准备容器
        if: inputs.mode == 'status'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker ps -a --filter name=gpu-image --format '{{.Names}} {{.Status}}'
          $names = & docker ps -a --filter name=gpu-image --format '{{.Names}}'
          foreach ($name in $names) {
            Write-Output "CONTAINER: $name"
            & docker logs --tail 60 $name
            & docker inspect $name --format '{{json .State}}'
            & docker stats --no-stream $name --format '{{.Name}} CPU={{.CPUPerc}} Memory={{.MemUsage}} Network={{.NetIO}} Disk={{.BlockIO}}'
          }
          $script = @'
          import json
          from pathlib import Path
          root = Path('/models')
          files = []
          seen = set()
          for path in root.rglob('*'):
              if path.is_symlink() or not path.is_file():
                  continue
              if not path.name.endswith(('.gguf', '.safetensors', '.incomplete')):
                  continue
              try:
                  stat = path.stat()
              except FileNotFoundError:
                  continue
              if stat.st_ino in seen:
                  continue
              seen.add(stat.st_ino)
              files.append({'path': str(path.relative_to(root)), 'MiB': round(stat.st_size / 2**20, 1), 'allocated_MiB': round(stat.st_blocks * 512 / 2**20, 1)})
          manifest = root / 'manifest.json'
          index = root / 'Qwen-Image-2.1/text_encoder/model.safetensors.index.json'
          encoder_total = json.loads(index.read_text())['metadata']['total_size'] if index.exists() else None
          encoder_cached = sum(item['allocated_MiB'] for item in files if '/text_encoder/' in item['path'])
          print(json.dumps({'encoder_cached_MiB': round(encoder_cached, 1), 'encoder_total_bytes': encoder_total, 'files': files, 'manifest': json.loads(manifest.read_text()) if manifest.exists() else None}, indent=2), flush=True)
          '@
          $script | & docker run --rm -i -v gpu-image-models:/models:ro ghcr.io/astral-sh/uv:python3.12-bookworm python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect cached model preparation progress.' }
      - name: 恢复停滞的编码器下载并核对官方校验值
        if: inputs.mode == 'repair-download'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $running = & docker ps --filter name=gpu-image-prepare- --filter status=running --format '{{.Names}}'
          foreach ($name in $running) {
            & docker stop --timeout 15 $name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stop stalled preparation before recovery.' }
          }
          $name = "gpu-image-prepare-http-$env:GITHUB_RUN_ID"
          & docker create --name $name --gpus all --ipc=host -e HF_HOME=/models/hf -e HF_HUB_DISABLE_XET=1 -e TMPDIR=/models -v gpu-image-models:/models lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py repair_download
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create encoder recovery container.' }
          & docker cp tools/gpu/image_edit.py "${name}:/opt/image_edit.py"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy recovery script.' }
          & docker start $name
          if ($LASTEXITCODE -ne 0) { throw 'Cannot start encoder recovery.' }
          & docker logs --tail 20 $name
          Write-Output "Recovery continues in background: $name. Check status; deploy once manifest is ready."
      - name: 下载组件并导出原生四位编码器
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker volume create gpu-image-models
          & docker volume create gpu-image-outputs
          $running = @(& docker ps --filter name=gpu-image-prepare- --filter status=running --format '{{.Names}}')
          if ($running.Count -gt 1) { throw 'Multiple preparation containers found; inspect status before proceeding.' }
          if ($running.Count -eq 1) {
            $name = $running[0]
            Write-Output "Resuming preparation container: $name"
            & docker logs --tail 15 $name
          } else {
            $name = "gpu-image-prepare-$env:GITHUB_RUN_ID"
            & docker create --name $name --gpus all --ipc=host -e HF_HOME=/models/hf -e HF_HUB_DISABLE_XET=1 -e TMPDIR=/models -v gpu-image-models:/models lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py prepare
            if ($LASTEXITCODE -ne 0) { throw 'Preparation container creation failed.' }
            & docker cp tools/gpu/image_edit.py "${name}:/opt/image_edit.py"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy deployment script.' }
            & docker start $name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot start preparation container.' }
          }
          & docker attach --sig-proxy=false $name
          $state = & docker inspect $name --format '{{json .State}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $state.Running -or $state.ExitCode -ne 0) { throw 'Quantized component preparation failed.' }
          & docker rm $name
      - name: 启动本机服务并实测图像编辑
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = & docker ps -a --filter name=^gpu-image-edit$ --format '{{.Names}}'
          if ($existing) { & docker rm -f gpu-image-edit }
          & docker create --name gpu-image-edit --restart unless-stopped --gpus all --ipc=host -p 127.0.0.1:30010:30010 -e HF_HOME=/models/hf -v gpu-image-models:/models -v gpu-image-outputs:/outputs lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py serve
          if ($LASTEXITCODE -ne 0) { throw 'Service container creation failed.' }
          & docker cp tools/gpu/image_edit.py gpu-image-edit:/opt/image_edit.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy service script.' }
          & docker start gpu-image-edit
          & docker exec gpu-image-edit python /opt/image_edit.py verify
          $verifyCode = $LASTEXITCODE
          & docker logs --tail 150 gpu-image-edit
          if ($verifyCode -ne 0) { throw 'Real image-edit verification failed; inspect service logs.' }
          New-Item -ItemType Directory -Force -Path gpu-edit-results | Out-Null
          & docker cp gpu-image-edit:/outputs/. gpu-edit-results
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve edit result.' }
      - uses: actions/upload-artifact@v4
        if: (inputs.mode == 'deploy' || inputs.mode == 'sample') && success()
        with:
          name: ${{ inputs.mode == 'sample' && 'gpu-edit-sample' || 'gpu-edit-results' }}
          path: ${{ inputs.mode == 'sample' && 'gpu-edit-sample-results' || 'gpu-edit-results' }}
          retention-days: 3
