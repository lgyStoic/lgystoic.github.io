name: GPU 图像编辑部署
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "probe 检查环境；status 查看容器进度；deploy 部署并验证"
        options: [probe, status, deploy]
        default: deploy
permissions:
  contents: read
concurrency:
  group: gpu-image-edit
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, dd-lgystoic]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 检查资源并准备推理镜像
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv
          & docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} Root={{.DockerRootDir}}'
          & docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          & docker run --rm ghcr.io/astral-sh/uv:python3.12-bookworm df -h /
          & docker pull lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570
          if ($LASTEXITCODE -ne 0) { throw 'Runtime image pull failed.' }
          & docker image inspect lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 --format '{{json .RepoDigests}}'
          $script = @'
          import subprocess, sys, importlib.util
          import torch
          print('Python:', sys.version, flush=True)
          print('Torch:', torch.__version__, 'CUDA:', torch.version.cuda, flush=True)
          print('GPU:', torch.cuda.get_device_name(), flush=True)
          print('Architectures:', torch.cuda.get_arch_list(), flush=True)
          for module in ['sglang.multimodal_gen.runtime.models.dits.qwen_image21', 'gguf']:
              print(module, importlib.util.find_spec(module), flush=True)
          subprocess.run(['df','-h','/'],check=True)
          '@
          $script | & docker run --rm --gpus all -i lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python -
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compatibility probe failed.' }
      - name: 查看已启动的编辑与准备容器
        if: inputs.mode == 'status'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker ps -a --filter name=gpu-image --format '{{.Names}} {{.Status}}'
          $names = & docker ps -a --filter name=gpu-image --format '{{.Names}}'
          foreach ($name in $names) {
            Write-Output "CONTAINER: $name"
            & docker logs --tail 60 $name
            & docker inspect $name --format '{{json .State}}'
          }
      - name: 下载组件并导出原生四位编码器
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker volume create gpu-image-models
          & docker volume create gpu-image-outputs
          $running = @(& docker ps --filter name=gpu-image-prepare- --filter status=running --format '{{.Names}}')
          if ($running.Count -gt 1) { throw 'Multiple preparation containers found; inspect status before proceeding.' }
          if ($running.Count -eq 1) {
            $name = $running[0]
            Write-Output "Resuming preparation container: $name"
            & docker logs --tail 15 $name
          } else {
            $name = "gpu-image-prepare-$env:GITHUB_RUN_ID"
            & docker create --name $name --gpus all --ipc=host -e HF_HOME=/models/hf -e TMPDIR=/models -v gpu-image-models:/models lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py prepare
            if ($LASTEXITCODE -ne 0) { throw 'Preparation container creation failed.' }
            & docker cp tools/gpu/image_edit.py "${name}:/opt/image_edit.py"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy deployment script.' }
            & docker start $name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot start preparation container.' }
          }
          & docker attach --sig-proxy=false $name
          $state = & docker inspect $name --format '{{json .State}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $state.Running -or $state.ExitCode -ne 0) { throw 'Quantized component preparation failed.' }
          & docker rm $name
      - name: 启动本机服务并实测图像编辑
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = & docker ps -a --filter name=^gpu-image-edit$ --format '{{.Names}}'
          if ($existing) { & docker rm -f gpu-image-edit }
          & docker create --name gpu-image-edit --restart unless-stopped --gpus all --ipc=host -p 127.0.0.1:30010:30010 -e HF_HOME=/models/hf -v gpu-image-models:/models -v gpu-image-outputs:/outputs lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py serve
          if ($LASTEXITCODE -ne 0) { throw 'Service container creation failed.' }
          & docker cp tools/gpu/image_edit.py gpu-image-edit:/opt/image_edit.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy service script.' }
          & docker start gpu-image-edit
          & docker exec gpu-image-edit python /opt/image_edit.py verify
          $verifyCode = $LASTEXITCODE
          & docker logs --tail 150 gpu-image-edit
          if ($verifyCode -ne 0) { throw 'Real image-edit verification failed; inspect service logs.' }
          New-Item -ItemType Directory -Force -Path gpu-edit-results | Out-Null
          & docker cp gpu-image-edit:/outputs/. gpu-edit-results
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve edit result.' }
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'deploy' && success()
        with:
          name: gpu-edit-results
          path: gpu-edit-results
          retention-days: 3
