name: GPU 图像编辑部署
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "probe 检查；status 查看进度；repair-download 恢复下载；deploy 部署验证"
        options: [probe, status, repair-download, deploy, verify, reset-runtime, recover-runtime]
        default: deploy
permissions:
  contents: read
concurrency:
  group: gpu-image-edit
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, dd-lgystoic]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        if: inputs.mode != 'status'
      - name: 检查资源并准备推理镜像
        if: inputs.mode == 'probe' || inputs.mode == 'deploy' || inputs.mode == 'repair-download'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv
          & docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}} Root={{.DockerRootDir}}'
          & docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          & docker run --rm ghcr.io/astral-sh/uv:python3.12-bookworm df -h /
          & docker pull lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570
          if ($LASTEXITCODE -ne 0) { throw 'Runtime image pull failed.' }
          & docker image inspect lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 --format '{{json .RepoDigests}}'
          $script = @'
          import subprocess, sys, importlib.util
          import torch
          print('Python:', sys.version, flush=True)
          print('Torch:', torch.__version__, 'CUDA:', torch.version.cuda, flush=True)
          print('GPU:', torch.cuda.get_device_name(), flush=True)
          print('Architectures:', torch.cuda.get_arch_list(), flush=True)
          for module in ['sglang.multimodal_gen.runtime.models.dits.qwen_image21', 'gguf']:
              print(module, importlib.util.find_spec(module), flush=True)
          subprocess.run(['df','-h','/'],check=True)
          '@
          $script | & docker run --rm --gpus all -i lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python -
          if ($LASTEXITCODE -ne 0) { throw 'Runtime compatibility probe failed.' }
      - name: 查看已启动的编辑与准备容器
        if: inputs.mode == 'status'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker ps -a --filter name=gpu-image --format '{{.Names}} {{.Status}}'
          $names = & docker ps -a --filter name=gpu-image --format '{{.Names}}'
          foreach ($name in $names) {
            Write-Output "CONTAINER: $name"
            & docker logs --tail 60 $name
            & docker inspect $name --format '{{json .State}}'
            & docker stats --no-stream $name --format '{{.Name}} CPU={{.CPUPerc}} Memory={{.MemUsage}} Network={{.NetIO}} Disk={{.BlockIO}}'
          }
          Write-Output 'WINDOWS_MEMORY:'
          Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory | Select-Object CommittedBytes, CommitLimit, AvailableMBytes, PercentCommittedBytesInUse | Format-List
          Get-CimInstance Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory, AutomaticManagedPagefile | Format-List
          Get-Process | Sort-Object PrivateMemorySize64 -Descending | Select-Object -First 8 Name, PrivateMemorySize64, WorkingSet64 | Format-Table -AutoSize
          Get-Command uv, python -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-Table -AutoSize
          Write-Output 'WINDOWS_STARTUP_AND_SECURITY:'
          & whoami /groups
          Get-MpPreference -ErrorAction SilentlyContinue | Select-Object EnableControlledFolderAccess | Format-List
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1123,1121; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Select-Object -First 4 TimeCreated, Id, Message | Format-List
          Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'Docker|Startup' } | Select-Object TaskName, TaskPath, State, @{Name='User';Expression={$_.Principal.UserId}}, @{Name='LogonType';Expression={$_.Principal.LogonType}} | Format-List
          Get-Acl (Join-Path $env:USERPROFILE '.docker') | Select-Object Owner, AccessToString | Format-List
          Write-Output 'WINDOWS_GPU_AND_VM_EVENTS:'
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Display|nvlddmkm|Hyper-V-Compute|Lxss' } | Select-Object -First 12 TimeCreated, ProviderName, Id, Message | Format-List
          Write-Output 'WSL_KERNEL_LOG:'
          & docker run --rm --privileged ghcr.io/astral-sh/uv:python3.12-bookworm dmesg | Select-Object -Last 100
          $vmLog = Join-Path $env:LOCALAPPDATA 'Docker\log\vm\console.log'
          if (Test-Path $vmLog) { Get-Content $vmLog -Tail 160 }
          $hostLog = Join-Path $env:LOCALAPPDATA 'Docker\log\host\com.docker.backend.exe.log'
          if (Test-Path $hostLog) { Get-Content $hostLog | Select-String -Pattern 'out of memory|panic|crash|fatal|WSL exited|restarting' | Select-Object -Last 20 }
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Docker\log\vm') -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          $compatFile = Join-Path $env:RUNNER_TEMP 'gpu-image-hf-utils.py'
          & docker cp gpu-image-edit:/sgl-workspace/sglang/python/sglang/multimodal_gen/runtime/utils/hf_diffusers_utils.py $compatFile
          Write-Output "COMPAT_COPY_EXIT: $LASTEXITCODE"
          if (Test-Path $compatFile) {
            Write-Output ("COMPAT_BYTES: " + (Get-Item $compatFile).Length)
            Write-Output ([System.IO.File]::ReadAllText($compatFile).Substring(0, [Math]::Min(1500, (Get-Item $compatFile).Length)))
            Get-Content $compatFile | Select-String -Pattern '_WEIGHT_FILE_PATTERNS' -Context 0,12
          }
          $script = @'
          import json
          from pathlib import Path
          root = Path('/models')
          files = []
          seen = set()
          for path in root.rglob('*'):
              if path.is_symlink() or not path.is_file():
                  continue
              if not path.name.endswith(('.gguf', '.safetensors', '.incomplete')):
                  continue
              try:
                  stat = path.stat()
              except FileNotFoundError:
                  continue
              if stat.st_ino in seen:
                  continue
              seen.add(stat.st_ino)
              files.append({'path': str(path.relative_to(root)), 'MiB': round(stat.st_size / 2**20, 1), 'allocated_MiB': round(stat.st_blocks * 512 / 2**20, 1)})
          manifest = root / 'manifest.json'
          index = root / 'Qwen-Image-2.1/text_encoder/model.safetensors.index.json'
          encoder_total = json.loads(index.read_text())['metadata']['total_size'] if index.exists() else None
          encoder_cached = sum(item['allocated_MiB'] for item in files if '/text_encoder/' in item['path'])
          print(json.dumps({'encoder_cached_MiB': round(encoder_cached, 1), 'encoder_total_bytes': encoder_total, 'files': files, 'manifest': json.loads(manifest.read_text()) if manifest.exists() else None}, indent=2), flush=True)
          '@
          $script | & docker run --rm -i -v gpu-image-models:/models:ro ghcr.io/astral-sh/uv:python3.12-bookworm python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect cached model preparation progress.' }
      - name: 恢复已停止的桌面运行时
        if: inputs.mode == 'recover-runtime'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $daemonFile = Join-Path $env:USERPROFILE '.docker\daemon.json'
          if (Test-Path $daemonFile) {
            Get-Item $daemonFile | Select-Object FullName, Attributes, Length | Format-List
            Get-Acl $daemonFile | Select-Object Owner, AccessToString | Format-List
            if ((Get-Item $daemonFile).IsReadOnly) { (Get-Item $daemonFile).IsReadOnly = $false }
          }
          Get-Process -Name 'Docker Desktop','com.docker.backend' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $launch = @'
          import os, subprocess
          child_env = os.environ.copy()
          child_env.pop('RUNNER_TRACKING_ID', None)
          subprocess.Popen([r'C:\Program Files\Docker\Docker\Docker Desktop.exe'], env=child_env,
                           creationflags=subprocess.DETACHED_PROCESS | subprocess.CREATE_NEW_PROCESS_GROUP)
          '@
          & 'C:\Program Files\Python312\python.exe' -c $launch
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            try {
              & docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}}' 2>$null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            } catch { Write-Output 'Docker startup pending.' }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            $hostLog = Join-Path $env:LOCALAPPDATA 'Docker\log\host\com.docker.backend.exe.log'
            if (Test-Path $hostLog) { Get-Content $hostLog -Tail 30 }
            throw 'Docker runtime recovery did not become ready.'
          }
          Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory | Select-Object CommittedBytes, CommitLimit, AvailableMBytes | Format-List
      - name: 释放编辑运行时的主机提交内存
        if: inputs.mode == 'reset-runtime'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $foreign = @(& docker ps --format '{{.Names}}' | Where-Object { $_ -notlike 'gpu-image-*' })
          if ($foreign.Count -gt 0) { throw 'Other running containers found; runtime reset would affect them.' }
          Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory | Select-Object CommittedBytes, CommitLimit, AvailableMBytes | Format-List
          $existing = & docker ps -a --filter name=^gpu-image-edit$ --format '{{.Names}}'
          if ($existing) { & docker rm -f gpu-image-edit }
          & docker desktop restart --timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'Docker runtime restart failed.' }
          & docker info --format 'CPUs={{.NCPU}} Memory={{.MemTotal}}'
          Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory | Select-Object CommittedBytes, CommitLimit, AvailableMBytes | Format-List
      - name: 恢复停滞的编码器下载并核对官方校验值
        if: inputs.mode == 'repair-download'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $running = & docker ps --filter name=gpu-image-prepare- --filter status=running --format '{{.Names}}'
          foreach ($name in $running) {
            & docker stop --timeout 15 $name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stop stalled preparation before recovery.' }
          }
          $name = "gpu-image-prepare-http-$env:GITHUB_RUN_ID"
          & docker create --name $name --gpus all --ipc=host -e HF_HOME=/models/hf -e HF_HUB_DISABLE_XET=1 -e TMPDIR=/models -v gpu-image-models:/models lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py repair_download
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create encoder recovery container.' }
          & docker cp tools/gpu/image_edit.py "${name}:/opt/image_edit.py"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy recovery script.' }
          & docker start $name
          if ($LASTEXITCODE -ne 0) { throw 'Cannot start encoder recovery.' }
          & docker logs --tail 20 $name
          Write-Output "Recovery continues in background: $name. Check status; deploy once manifest is ready."
      - name: 下载组件并导出原生四位编码器
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & docker volume create gpu-image-models
          & docker volume create gpu-image-outputs
          $running = @(& docker ps --filter name=gpu-image-prepare- --filter status=running --format '{{.Names}}')
          if ($running.Count -gt 1) { throw 'Multiple preparation containers found; inspect status before proceeding.' }
          if ($running.Count -eq 1) {
            $name = $running[0]
            Write-Output "Resuming preparation container: $name"
            & docker logs --tail 15 $name
          } else {
            $name = "gpu-image-prepare-$env:GITHUB_RUN_ID"
            & docker create --name $name --gpus all --ipc=host -e HF_HOME=/models/hf -e HF_HUB_DISABLE_XET=1 -e TMPDIR=/models -v gpu-image-models:/models lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py prepare
            if ($LASTEXITCODE -ne 0) { throw 'Preparation container creation failed.' }
            & docker cp tools/gpu/image_edit.py "${name}:/opt/image_edit.py"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot copy deployment script.' }
            & docker start $name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot start preparation container.' }
          }
          & docker attach --sig-proxy=false $name
          $state = & docker inspect $name --format '{{json .State}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $state.Running -or $state.ExitCode -ne 0) { throw 'Quantized component preparation failed.' }
          & docker rm $name
      - name: 启动本机服务并实测图像编辑
        if: inputs.mode == 'deploy'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = & docker ps -a --filter name=^gpu-image-edit$ --format '{{.Names}}'
          if ($existing) { & docker rm -f gpu-image-edit }
          & docker create --name gpu-image-edit --memory 16g --memory-swap 16g --restart unless-stopped --gpus all --ipc=host -p 127.0.0.1:30010:30010 -e HF_HOME=/models/hf -v gpu-image-models:/models -v gpu-image-outputs:/outputs lmsysorg/sglang:nightly-dev-cu13-20261002-67eab570 python /opt/image_edit.py serve
          if ($LASTEXITCODE -ne 0) { throw 'Service container creation failed.' }
          & docker cp tools/gpu/image_edit.py gpu-image-edit:/opt/image_edit.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy service script.' }
          & docker start gpu-image-edit
      - name: 独立客户端执行真实图像编辑验收
        if: inputs.mode == 'deploy' || inputs.mode == 'verify'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $client = "gpu-image-verify-$env:GITHUB_RUN_ID"
          & docker create --name $client --memory 256m --memory-swap 256m --network container:gpu-image-edit -v gpu-image-outputs:/outputs ghcr.io/astral-sh/uv:python3.12-bookworm uv run --with requests --with pillow python /opt/image_edit.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create verification client.' }
          & docker cp tools/gpu/image_edit.py "${client}:/opt/image_edit.py"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot copy verification script.' }
          & docker start -a $client
          $state = & docker inspect $client --format '{{json .State}}' | ConvertFrom-Json
          & nvidia-smi --query-gpu=memory.used,memory.free --format=csv
          & docker logs --tail 200 gpu-image-edit
          & docker inspect gpu-image-edit --format '{{json .State}}'
          if ($state.Running -or $state.ExitCode -ne 0) { throw 'Real image-edit verification failed; inspect service logs.' }
          & docker rm $client
          New-Item -ItemType Directory -Force -Path gpu-edit-results | Out-Null
          & docker cp gpu-image-edit:/outputs/. gpu-edit-results
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve edit result.' }
      - uses: actions/upload-artifact@v4
        if: (inputs.mode == 'deploy' || inputs.mode == 'verify') && success()
        with:
          name: gpu-edit-results
          path: gpu-edit-results
          retention-days: 3
