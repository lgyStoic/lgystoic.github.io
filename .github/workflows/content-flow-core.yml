name: 内容交接核心回归

on:
  pull_request:
    paths:
      - 'tools/content_flow/**'
      - 'docs/prd/content-flow.md'
      - '.github/workflows/content-flow-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行交接状态核心回归
        run: python3 -m unittest discover -s tools/content_flow -p 'test_*.py' -v
