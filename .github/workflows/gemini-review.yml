name: LongCat patch review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository containing the branch to review"
        type: string
        required: true
        default: "lgyStoic/sglang"
      ref:
        description: "Branch or commit to review"
        type: string
        required: true
        default: "codex/qwen-image-edit-batching"
      base_repository:
        description: "Repository containing the comparison base"
        type: string
        required: true
        default: "sgl-project/sglang"
      base_ref:
        description: "Base branch or commit"
        type: string
        required: true
        default: "main"
      task:
        description: "What the SGLang contributor agent should focus on"
        type: string
        required: true
        default: "Review the Qwen Image Edit dynamic-batching change and assess the focused unit-test results. Do not edit files or push changes."

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: docker.io/lmsysorg/sglang@sha256:2b11d06617917b0cbbddf0ffe3da54ce4310a3bc4672497e1cd46069abf58a8a # v0.5.20-xeon
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - name: Fetch patch
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          BASE_REPOSITORY: ${{ inputs.base_repository }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git clone --depth=1 --branch "$REF" "https://github.com/$REPOSITORY.git" target
          git -C target remote add review-base "https://github.com/$BASE_REPOSITORY.git"
          git -C target fetch --depth=1 review-base "$BASE_REF"
          git -C target diff --no-ext-diff --unified=5 FETCH_HEAD HEAD -- \
            python/sglang/multimodal_gen/configs/pipeline_configs/base.py \
            python/sglang/multimodal_gen/configs/pipeline_configs/qwen_image.py \
            python/sglang/multimodal_gen/runtime/managers/scheduler.py \
            python/sglang/multimodal_gen/runtime/pipelines_core/stages/image_encoding.py \
            python/sglang/multimodal_gen/runtime/pipelines_core/stages/input_validation.py \
            python/sglang/multimodal_gen/test/unit/test_qwen_image_edit_dynamic_batch.py > review.diff
          test -s review.diff

      - name: Install CPU test dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Run focused CPU unit tests
        id: tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          # Hosted runners can expose a different CPU ISA from the Xeon used to
          # build the image; keep PyTorch/oneDNN on the broadly supported path.
          ATEN_CPU_CAPABILITY: default
          ONEDNN_MAX_CPU_ISA: AVX2
          DNNL_MAX_CPU_ISA: AVX2
          # The upstream Xeon image preloads Intel-optimized libraries that
          # can SIGILL on GitHub-hosted CPU models; tests don't need that preload.
          LD_PRELOAD: ""
        run: |
          set +e
          PYTHONPATH="$PWD/target/python" python3 -m pytest -q \
            target/python/sglang/multimodal_gen/test/unit/test_qwen_image_edit_dynamic_batch.py \
            > test-report.txt 2>&1
          result=$?
          if [ ! -s test-report.txt ]; then
            printf 'pytest produced no output (exit code %s); process may have terminated by signal.\n' "$result" > test-report.txt
          fi
          cat test-report.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compile changed Python files
        continue-on-error: true
        run: |
          git -C target diff --name-only FETCH_HEAD HEAD -- '*.py' > changed-python-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] || python3 -m py_compile "target/$file"
          done < changed-python-files.txt
      - name: Ask LongCat to review
        env:
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          LONGCAT_MAX_TOKENS: "32768"
        run: |
          python3 tools/gemini_review.py --diff review.diff --out longcat-agent-report.md
          cat longcat-agent-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Require focused CPU tests to pass
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          if [ "$TEST_EXIT_CODE" != "0" ]; then
            echo "::error::Focused CPU tests failed or could not run (exit code: ${TEST_EXIT_CODE:-unknown}). See test-report.txt and the LongCat review above."
            exit 1
          fi
      - name: Upload test and agent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sglang-longcat-agent-report
          path: |
            test-report.txt
            longcat-agent-report.md
            changed-python-files.txt
          if-no-files-found: warn
          retention-days: 14
