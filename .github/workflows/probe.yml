name: 源探针
on:
  workflow_dispatch:
    inputs:
      urls: {description: 每行一个 URL（RSS / Atom / JSON），打印可达性、条数和前两条标题, required: true, type: string}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 试抓
        env: {PROBE_URLS: "${{ inputs.urls }}"}
        run: python3 tools/probe.py
