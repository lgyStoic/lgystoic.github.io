name: AI 信息雷达

on:
  schedule:
    # 北京时间 07:17 / 08:43 / 10:31。各阶段只跳过已提交的当天产物。
    - cron: "17 23 * * *"
    - cron: "43 0 * * *"
    - cron: "31 2 * * *"
  push:
    branches: [master]
    paths: [radar/trigger]
  workflow_dispatch:
    inputs:
      window_hours:
        description: "抓取时间窗口（小时）；留空使用默认值"
        required: false
        default: ""
      reason:
        description: "触发原因（health.yml 补跑时填 schedule_missed）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip_radar: ${{ steps.probe.outputs.skip_radar }}
      skip_events: ${{ steps.probe.outputs.skip_events }}
      skip_tracks: ${{ steps.probe.outputs.skip_tracks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 核对各阶段已提交产物
        id: probe
        run: python3 tools/radar_stage_guard.py >> "$GITHUB_OUTPUT"

  radar:
    needs: guard
    if: needs.guard.outputs.skip_radar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装可选模型 SDK
        run: pip install --quiet anthropic
      - name: 记录本次运行元数据
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          from pathlib import Path
          path = Path("radar/data/last-run.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
            "run_id": int(os.environ["GITHUB_RUN_ID"]),
            "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
            "event": os.environ["GITHUB_EVENT_NAME"],
            "sha": os.environ["GITHUB_SHA"],
            "started_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
            "url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False, indent=2) + "\n")
          EOF
          : > radar/data/last-run.log
      - name: 抓取并打分
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          RADAR_WINDOW_HOURS: ${{ inputs.window_hours }}
        shell: bash
        run: set -o pipefail; python3 tools/radar.py 2>&1 | tee -a radar/data/last-run.log
      - name: 渲染雷达页面
        run: python3 tools/build.py
      - name: 提交雷达结果
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python3 tools/publish_results.py radar --message "雷达：更新每日数据"

  events:
    needs: guard
    if: needs.guard.outputs.skip_events != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
      - name: 安装可选模型 SDK
        run: pip install --quiet anthropic
      - name: 找活动
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          LONGCAT_TIMEOUT: "60"
          EVENTS_AI_BUDGET_SECONDS: "600"
          EVENTS_DETAIL_BUDGET_SECONDS: "240"
        run: python3 tools/events.py
      - name: 渲染活动页面
        if: always() && steps.setup.outcome == 'success'
        id: build
        run: python3 tools/build.py
      - name: 提交活动结果
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python3 tools/publish_results.py radar --message "雷达：更新活动数据"

  tracks:
    needs: [guard, radar]
    if: always() && needs.guard.result == 'success' && (needs.radar.result == 'success' || needs.radar.result == 'skipped') && needs.guard.outputs.skip_tracks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
      - name: 安装可选模型 SDK
        run: pip install --quiet anthropic
      - name: 更新专题
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          TRACKS_FORCE_DIGEST: ${{ inputs.reason == 'tracks-digest' && '1' || '' }}
        run: python3 tools/tracks.py
      - name: 渲染专题页面
        if: always() && steps.setup.outcome == 'success'
        id: build
        run: python3 tools/build.py
      - name: 提交已完成的专题结果
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python3 tools/publish_results.py radar --message "雷达：更新专题数据"

  inbox:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装可选模型 SDK
        run: pip install --quiet anthropic
      - name: 整理私有收件箱
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_MODEL: ${{ vars.LONGCAT_MODEL || 'LongCat-2.0' }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          INBOX_REPO: ${{ vars.INBOX_REPO || 'lgyStoic/radar-inbox' }}
        run: python3 tools/inbox.py

  audit:
    needs: [guard, radar, events, tracks, inbox]
    if: always() && needs.guard.result == 'success' && (needs.radar.result == 'success' || needs.radar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 写逐阶段巡检报告
        env:
          RADAR_TRIGGER_REASON: ${{ inputs.reason }}
          RADAR_STAGE_RADAR: ${{ needs.radar.result }}
          RADAR_STAGE_EVENTS: ${{ needs.events.result }}
          RADAR_STAGE_TRACKS: ${{ needs.tracks.result }}
          RADAR_STAGE_INBOX: ${{ needs.inbox.result }}
        run: python3 tools/check.py
      - name: 渲染页面
        run: python3 tools/build.py
      - name: 提交巡检结果
        id: publish
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python3 tools/publish_results.py radar --message "雷达：更新巡检报告"
      - name: 通知 IndexNow
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          INDEXNOW_ALL: ${{ github.event.inputs.reason == 'indexnow-all' && '1' || '' }}
        run: python3 tools/indexnow.py
