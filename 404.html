<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 | Anaxagore</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1b1a'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='Helvetica,Arial' font-weight='700' fill='%23fbfaf8'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/site.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- build:header -->
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" aria-label="首页">
          <span class="brand-mark">A</span>
          <span>Anaxagore</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="/notes/">笔记</a>
          <a href="/radar/">雷达</a>
          <a href="/radar/events/">活动</a>
          <a href="/radar/jobs/">工作</a>
          <a href="/guides/">指南</a>
          <a href="/about/">关于</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅色">
            <span data-theme-icon>◑</span>
          </button>
        </nav>
      </div>
    </header>
    <!-- /build:header -->

    <main class="wrap">
      <section class="notfound">
        <p class="kicker">404</p>
        <h1>这个页面还没有整理出来。</h1>
        <p>链接可能过期了，或者笔记还在草稿里。</p>
        <ul class="links">
          <li><a href="/">回到首页</a></li>
          <li><a href="/notes/">笔记归档</a></li>
        </ul>
      </section>
    </main>
  <!-- build:analytics -->
    <script data-goatcounter="https://anaxagore.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>(function(){
  function gc(){return window.goatcounter&&window.goatcounter.count?window.goatcounter:null}
  function send(path,title){var g=gc();if(g)g.count({path:path,title:title||path,event:true})}
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a");
    if(!a)return;
    var offer=a.closest(".offer");
    if(a.hasAttribute("data-aff-link")||a.hasAttribute("data-aff")||(a.rel||"").indexOf("sponsored")>-1){
      var key=(offer&&offer.getAttribute("data-aff"))||a.getAttribute("data-aff")||"link";
      send("aff/"+key,"推荐位："+key+" @ "+location.pathname);return}
    if(a.host&&a.host!==location.host){send("out/"+a.host,"外链："+a.host+" @ "+location.pathname)}
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-share-copy],[data-share-native]");
    if(b)send("share/"+(b.hasAttribute("data-share-copy")?"copy":"native"),"分享 @ "+location.pathname)
  });
})();</script>
    <!-- /build:analytics -->
  </body>
</html>
